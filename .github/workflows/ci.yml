name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HoverText.sln

      - name: Build
        run: dotnet build HoverText.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HoverText.sln --configuration Release --no-build --verbosity normal
