name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-windows:
    name: Publish Windows x64 EXE
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore .\HoverText.sln

      - name: Test
        run: dotnet test .\HoverText.sln --configuration Release --no-restore --verbosity normal

      - name: Restore Windows runtime
        run: dotnet restore .\src\HoverText.App\HoverText.App.csproj -r win-x64

      - name: Publish single-file EXE
        run: >
          dotnet publish .\src\HoverText.App\HoverText.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output .\artifacts\publish\win-x64

      - name: Prepare release asset and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\release | Out-Null
          Copy-Item .\artifacts\publish\win-x64\HoverText.App.exe .\artifacts\release\HoverText-win-x64.exe -Force
          $sha = (Get-FileHash .\artifacts\release\HoverText-win-x64.exe -Algorithm SHA256).Hash
          $notes = @(
            "Windows x64 standalone EXE release.",
            "",
            "## What's included",
            "- Windows Hover Text-style floating text reader for low-vision users.",
            "- UI Automation text reading, optional local OCR fallback, and pixel magnifier fallback.",
            "- Selectable GDI screenshot, Windows Magnification API, and GPU / DirectX desktop duplication magnifier backends.",
            "",
            "## SEO / search terms",
            "Windows Hover Text, low vision accessibility, Windows screen magnifier alternative, cursor text magnifier, UI Automation text reader, OCR text reader, WPF accessibility tool, assistive technology for visually impaired Windows users.",
            "",
            "Download asset: HoverText-win-x64.exe",
            "",
            "SHA256: $sha",
            "",
            "Note: this EXE is currently unsigned, so Windows SmartScreen may show a warning on first run."
          )
          Set-Content -Path .\artifacts\release\RELEASE_NOTES.md -Encoding UTF8 -Value $notes

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: HoverText ${{ env.RELEASE_TAG }} - Windows Hover Text and Cursor Magnifier
          body_path: artifacts/release/RELEASE_NOTES.md
          files: artifacts/release/HoverText-win-x64.exe
